<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小游戏事务请求</title><style>body{font:16px system-ui;max-width:700px;margin:40px auto;background:#101923;color:#dae5ed}label{display:block;margin:16px 0}input,select,button,textarea{padding:10px;font:inherit}textarea{box-sizing:border-box;width:100%;height:260px}button{cursor:pointer}</style><h1>小游戏事务请求</h1><p>每一步由发动机核验后提交。此页只生成请求，不计算输赢、不修改账户，也不自动推进时间。</p><form id="form"><label>存档ID <input id="save" required size="42"></label><label>命令ID <input id="command" required></label><label>会话ID <input id="session" required pattern="[A-Za-z0-9_-]{1,100}"></label><label>账户 <select id="account"><option value="covert">潜伏账户（铜）</option><option value="shop">余火账户（铜）</option></select></label><label>操作 <select id="action"><option>reserve</option><option>play</option><option>settle</option><option>cancel</option></select></label><label>预留铜数 <input id="stake" type="number" min="1" step="1" value="100"></label><label>选择 <select id="choice"><option>heads</option><option>tails</option></select></label><button>生成待核验请求</button></form><p>请求需由指挥官明确确认，经 host intent 或已有有效授权提交。报价、此页内容和客户端自称的输赢都不是入账凭证。</p><textarea id="out" readonly aria-label="待核验请求"></textarea><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const val=id=>document.getElementById(id).value;let request={schema:'DOMAIN_COMMAND_V2',command_id:val('command'),base_save_set_id:val('save'),kind:'game_session',session_id:val('session'),game_action:val('action'),account_id:val('account'),currency:'copper'};if(request.game_action==='reserve'){let n=Number(val('stake'));if(!Number.isSafeInteger(n)||n<=0)throw Error('请输入安全范围内的正整数铜数');request.stake_units=n;request.choice=val('choice')}document.getElementById('out').value=JSON.stringify({schema:'UNTRUSTED_COMMAND_REQUEST_V1',requires_verified_authorization:true,command:request},null,2)};</script></html>

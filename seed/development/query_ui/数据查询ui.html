<script data-source="app.js">
/* 远航者舰队管理 UI：无框架，所有真实数据来自 snapshot.json 的只读投影。 */
(()=>{
  'use strict';
  const root=document.getElementById('voyager-vivid-console'),data=JSON.parse(document.getElementById('voyager-console-data').textContent),stock=data.items,gear=data.equipped,meta=data.meta;
  const q=r=>root.querySelector('[data-role="'+r+'"]'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }
  [c])),fmt=n=>new Intl.NumberFormat('en-US').format(n);
  const state={
    view:'inventory',subview:'inventory',ship:'VES-LEITING1',shipSeries:'all',shipSearch:'',shipPerformance:null,shipDetail:'overview',account:'fleet-ledger',fleet:'voyager',sheet:'全部',origin:'all',status:'all',group:'all',search:'',expanded:new Set(),selected:null,request:false,sending:false,sortStock:0,sortGear:0
  };
  const commonFilter=r=>(state.fleet==='all'||r.fleet===state.fleet)&&(state.sheet==='全部'||r.category===state.sheet)&&(!state.search||[r.name,r.category,r.group||'',r.carrier||'',r.location||'',r.sourceGroup||'',r.status||'',meta.fleets[r.fleet]].some(v=>String(v).toLowerCase().includes(state.search.toLowerCase())));
  // 库存筛选：舰队、类别、来源、状态、搜索与同单位排序。
  function stockRows(){
    const rows=stock.filter(r=>commonFilter(r)&&(state.fleet!=='voyager'||state.origin==='all'||r.sourceGroup===state.origin)&&(state.status==='all'||r.status===state.status));
    return state.sortStock?rows.sort((a,b)=>meta.sheetCategories.indexOf(a.category)-meta.sheetCategories.indexOf(b.category)||String(a.unit).localeCompare(String(b.unit),'zh-CN')||state.sortStock*((a.estimatedValueGold??a.total)-(b.estimatedValueGold??b.total))):rows;
  }
  // 已装备筛选：舰队、类别、配属分组与同单位排序。
  function gearRows(){
    const rows=gear.filter(r=>commonFilter(r)&&(state.group==='all'||r.group===state.group));
    return state.sortGear?rows.sort((a,b)=>meta.sheetCategories.indexOf(a.category)-meta.sheetCategories.indexOf(b.category)||String(a.unit).localeCompare(String(b.unit),'zh-CN')||state.sortGear*(a.quantity-b.quantity)):rows;
  }
  function icons(){
    const renderer=typeof lucide!=='undefined'?lucide:window.VoyagerIcons;
    if(renderer?.createIcons)renderer.createIcons({
      attrs:{
        width:16,height:16
      }
    });
  }
  function money(value){
    const [integer,fraction]=String(value).split('.');
    return integer.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(fraction===undefined?'':'.'+fraction);
  }
  function accountSelected(){
    return data.accounts.find(a=>a.id===state.account)||data.accounts[0];
  }
  // 资金页：账户卡、精确金银铜余额、事实及来源。
  function renderFunds(){
    const funds=state.view==='funds',inventory=!funds&&state.subview==='inventory';
    q('funds').hidden=!funds;
    q('inventory-content').hidden=!inventory;
    q('inventory-summary').hidden=!inventory;
    q('inventory-closing').hidden=!inventory;
    q('sheets').hidden=!inventory;
    q('search-box').hidden=funds;
    q('refresh-label').textContent=funds?'请求刷新资金':inventory?'请求刷新库存':'请求刷新舰船';
    if(!funds)return;
    q('account-tabs').innerHTML=data.accounts.map(a=>`<button type="button" class="vs-account-tab cursor-interaction ${state.account===a.id?'active':''}" id="vs-account-tab-${a.id}" data-account="${a.id}" role="tab" aria-selected="${state.account===a.id}" aria-controls="vs-fund-account-content"><span class="vs-account-name"><i data-lucide="${{'fleet-ledger':'landmark','cover-fund':'shield','yuhuo-cash':'flame'}[a.id]||'wallet'}" aria-hidden="true"></i>${esc(a.name)}</span>${a.balances.map(b=>`<span class="vs-account-amount">${moneyHtml(b)}</span>`).join('')}<span class="vs-account-status ${a.id==='yuhuo-cash'?'pending':''}">${esc(a.status)}</span></button>`).join('');
    const a=accountSelected();
    q('account-detail').setAttribute('aria-labelledby','vs-account-tab-'+a.id);
    q('account-detail').innerHTML=`<div class="vs-fund-top"><div><div class="vs-subtle">资金 / ${esc(a.name)}</div><div class="vs-fund-title">${esc(a.scope)}</div></div><button type="button" class="vs-button cursor-interaction" data-action="verify-account"><i data-lucide="shield-check" aria-hidden="true"></i>核验账户</button></div><div class="vs-fund-facts">${a.balances.map(b=>`<div class="vs-fund-fact"><span>${esc(b.label)}</span><span class="vs-fund-fact-value">${moneyHtml(b)}</span></div>`).join('')}${a.facts.map(f=>`<div class="vs-fund-fact"><span>${esc(f.label)}</span><span class="vs-fund-fact-value">${f.amount!==undefined?moneyHtml(f):esc(f.text)}</span></div>`).join('')}</div><p class="vs-note">${esc(a.note)}</p><div class="vs-fund-time">存档时间 ${esc(a.snapshotTime.replace('T',' '))}</div><details class="vs-source"><summary class="cursor-interaction">查看真实账户字段</summary>${a.sources.map(source=>`<code>${esc(source)}</code>`).join('')}<code>${esc(meta.saveSetId)}</code></details>`;
    icons();
  }
  function accountVerifyPrompt(){
    const a=accountSelected();
    return '请只读核验资金智能 UI 中的账户：'+a.name+'（'+a.scope+'），当前显示 '+a.balances.map(b=>moneyText(b)+' '+b.label).join('；')+'，状态 '+a.status+'，来源 '+a.sources.join('；')+'，base_save_set_id='+meta.saveSetId+'。读取最新有效存档并用匹配Guard校验。舰队主账户按整数单位权威保留金币4位、灰币2位小数；潜伏资金和余火均独立于主余额。余火严格区分最后完整实点与暂记/待日结的已知交易锚。不得合并余额、把估值作现金、反推未封板流水或更改资金、时间和授权。';
  }
  function selected(){
    return state.selected?(state.selected.kind==='stock'?stock:gear).find(r=>r.id===state.selected.id):null;
  }
  function grouped(rows,kind){
    const map=new Map();
    for(const r of rows){
      const label=(state.fleet==='all'?meta.fleets[r.fleet]+' · ':'')+(kind==='stock'?r.sourceGroup:r.group);
      if(!map.has(label))map.set(label,[]);
      map.get(label).push(r);
    }
    if(kind==='stock'){
      const rank={
        '自有':0,'外购':1,'公共库存':2,'补给余额':3,'待核验资产':4,'战略库存':5
      };
      return [...map].sort(([a],[b])=>(rank[a.split(' · ').at(-1)]??8)-(rank[b.split(' · ').at(-1)]??8));
    }
    return [...map].sort(([a],[b])=>meta.groups.indexOf(a.split(' · ').at(-1))-meta.groups.indexOf(b.split(' · ').at(-1)));
  }
  function tableNumber(n){
    return fmt(n).replace(/,/g,',<wbr>');
  }
  function tableBody(rows,kind){
    let out='';
    const cols=kind==='stock'?4:3;
    for(const [label,all] of grouped(rows,kind)){
      const key=kind+':'+label,expanded=state.expanded.has(key),slice=expanded?all:all.slice(0,4);
      out+=`<tr class="vs-group-title"><td colspan="${cols}"><span class="vs-group-label">${esc(label)}</span>${all.length} 条</td></tr>`;
      for(const r of slice){
        const sel=state.selected?.id===r.id&&state.selected?.kind===kind;
        out+=`<tr class="${sel?'vs-selected-row':''}"><td><button type="button" class="vs-row-name cursor-interaction" data-select="${r.id}" data-category="${esc(r.category)}" data-kind="${kind}" aria-label="查看${esc(r.name)}详情">${esc(r.name)}</button><div class="vs-row-meta">${kind==='stock'?esc(meta.fleets[r.fleet].replace('舰队','')):esc(r.carrier)}</div></td>${kind==='stock'?`<td class="vs-num">${tableNumber(r.estimatedValueGold??r.total)}<span class="vs-unit">${r.measureKind==='estimated_value'?'金币估值':r.unit}</span></td>${r.measureKind==='estimated_value'?`<td class="vs-status">${state.sheet==='贵重物品'?esc(r.location):'—'}</td>`:`<td class="vs-num available">${r.available===null?'—':tableNumber(r.available)}<span class="vs-unit">${r.available===null?'待核验':r.unit}</span></td>`}<td data-status="${esc(r.status)}" class="vs-status ${!['可调用','存放中'].includes(r.status)?'warning':''}">${esc(r.status)}</td>`:`<td class="vs-num">${tableNumber(r.quantity)}<span class="vs-unit">${r.unit}</span></td><td data-status="${esc(r.status)}" class="vs-status ${r.status==='待核对'?'warning':''}">${esc(r.status)}${r.repair?`<div class="vs-subtle">维修 ${r.repair}</div>`:''}</td>`}</tr>`;
      }
      if(all.length>4)out+=`<tr class="vs-showmore"><td colspan="${cols}"><button type="button" class="cursor-interaction" data-expand="${esc(key)}">${expanded?'收起':'展开其余 '+(all.length-4)+' 条'}</button></td></tr>`;
    }
    return out;
  }
  // 主渲染入口：库存、已装备、底部 Sheet、资金与舰船查询。
  function render(){
    const left=stockRows(),right=gearRows();
    const valuablesOnly=state.sheet==='贵重物品',hasValuables=left.some(r=>r.measureKind==='estimated_value');
    q('stock-table').classList.toggle('vs-valuables',hasValuables);
    q('stock-sort').textContent=valuablesOnly?'估值 ↕':'数量 ↕';
    q('fleets').innerHTML=[...Object.entries(meta.fleets),['all','全部舰队']].map(([id,n])=>`<button type="button" class="vs-fleet cursor-interaction ${state.view==='inventory'&&state.fleet===id?'active':''}" data-fleet="${id}" aria-pressed="${state.view==='inventory'&&state.fleet===id}"><i data-lucide="${id==='all'?'layers':'ship'}" aria-hidden="true"></i>${n.replace('舰队','')}</button>`).join('')+`<button type="button" class="vs-fleet cursor-interaction ${state.view==='funds'?'active':''}" data-view="funds" aria-pressed="${state.view==='funds'}"><i data-lucide="wallet" aria-hidden="true"></i>资金</button>`;
    q('origins').innerHTML=[['all','全部来源'],['自有','自有'],['外购','外购']].map(([id,n])=>`<button type="button" class="vs-origin cursor-interaction ${state.origin===id?'active':''}" data-origin="${id}" aria-pressed="${state.origin===id}" ${state.fleet!=='voyager'||['补给物资','贵重物品'].includes(state.sheet)?'disabled':''}>${n}</button>`).join('');
    q('origins').hidden=state.fleet!=='voyager'||['补给物资','贵重物品'].includes(state.sheet);
    q('gear-group').innerHTML=[['all','全部配属'],...meta.groups.filter(g=>gear.some(r=>r.group===g&&(state.fleet==='all'||r.fleet===state.fleet))).map(g=>[g,g])].map(([id,n])=>`<option value="${id}">${n}</option>`).join('');
    q('gear-group').value=state.group;
    q('stock-count').textContent=left.length+' 条';
    q('gear-count').textContent=right.length+' 条';
    q('stock-rows').innerHTML=renderStockTiles(left);
    q('gear-rows').innerHTML=renderGearTiles(right);
    q('stock-empty').hidden=left.length>0;
    q('gear-empty').hidden=right.length>0;
    q('sheet-summary').textContent=`${state.sheet==='全部'?'全部类别':state.sheet} · 库存 ${left.length} 条 / 已装备 ${right.length} 条`;
    q('sheets').innerHTML='<span class="vs-workbook-mark"><i data-lucide="panels-top-left" aria-hidden="true"></i></span>'+meta.sheetCategories.map((cat,index)=>`<button type="button" class="vs-sheet cursor-interaction ${state.sheet===cat?'active':''}" role="tab" id="vs-sheet-${index}" aria-controls="vs-sheet-content" aria-selected="${state.sheet===cat}" data-sheet="${cat}"><i data-lucide="${{'全部':'layers','单兵武器':'shield','各类装备':'bot','运输载具':'truck','补给物资':'package','舰载装备':'crosshair','贵重物品':'gem'}[cat]}" aria-hidden="true"></i>${cat}</button>`).join('');
    root.querySelector('#vs-sheet-content').setAttribute('aria-labelledby','vs-sheet-'+meta.sheetCategories.indexOf(state.sheet));
    renderDetail();
    renderFunds();
    renderShips();
    icons();
  }
  // 物资详情：数量、状态、配属、型号性能与请求入口。
  function renderDetail(){
    const r=selected();
    if(state.view==='funds'||state.subview!=='inventory'||!r){
      q('detail').hidden=true;
      return;
    }
    const kind=state.selected.kind;
    q('detail').hidden=false;
    if(r.measureKind==='estimated_value'){
      renderValuableDetail(r);
      return;
    }
    const quantity=kind==='stock'?r.total:r.quantity;
    const quantityLabel=kind==='stock'?'持有数量':'已装备数量';
    const allocations=kind==='stock'?Object.entries(r.allocations).map(([carrier,quantity])=>({
      carrier,quantity,unit:r.unit
    })):r.details;
    const statusNote=kind==='stock'?'真实写回未开放：当前存档仍缺机读授权及必要资产映射。':r.status==='待核对'?r.note:'';

   const active=state.selected?.kind===kind&&state.selected.id===r.id,valuation=r.measureKind==='estimated_value';
   const quantity=kind==='gear'?r.quantity:valuation?r.estimatedValueGold:r.total,amount=fmt(quantity),unit=valuation?'金币估值':r.unit;
   return `<div class="vs-stock-item" role="listitem"><button type="button" class="vs-ship-option vs-stock-option cursor-interaction ${active?'active':''} ${valuation?'vs-stock-valuation':''}" data-select="${esc(r.id)}" data-kind="${kind}" data-category="${esc(r.category)}" data-status="${esc(r.status)}" aria-pressed="${active}" aria-label="查看${esc(r.name)}详情，${valuation?'估值':kind==='gear'?'已装备':'持有'}${amount}${esc(unit)}，${esc(r.status)}${kind==='gear'?'，'+esc(r.carrier):''}"><span class="vs-stock-name">${esc(r.name)}</span><span class="vs-stock-value">${tableNumber(quantity)}<small>${esc(unit)}</small></span>${kind==='gear'&&r.repair?`<span class="vs-tile-warning">维修 ${fmt(r.repair)} ${esc(r.unit)}</span>`:''}${kind==='gear'&&r.status==='待核对'?'<span class="vs-tile-warning">数量待核对</span>':''}</button></div>`;
  }).join('')}</div>${all.length>4?`<button type="button" class="vs-stock-expand cursor-interaction" data-expand="${esc(key)}" aria-expanded="${expanded}">${expanded?'收起':'展开其余 '+(all.length-4)+' 条'}<i data-lucide="${expanded?'chevron-up':'chevron-down'}" aria-hidden="true"></i></button>`:''}</section>`;
    }).join('');
  }
  function renderStockTiles(rows){
    return renderInventoryTiles(rows,'stock');
  }
  function renderGearTiles(rows){
    return renderInventoryTiles(rows,'gear');
  }
  root.addEventListener('click',e=>{
    const tile=e.target.closest('.vs-stock-option');
    if(tile)root.querySelector('[data-select="'+tile.dataset.select+'"][data-kind="'+tile.dataset.kind+'"]')?.focus({
      preventScroll:true
    });
  });
  const coinDisplayUnits={
    "gold":"10000","silver":"100","copper":"1"
  };
  function coinCurrency(record){
    return record.currency||({
      '金币':'gold','银币':'silver','铜币':'copper'
    }
    [record.unit]);
  }
  // 将精确金额转换为整数铜币，再拆分金币、银币、铜币。
  function moneyCoinParts(record){
    const currency=coinCurrency(record);
    if(!Object.hasOwn(coinDisplayUnits,currency))return null;
    const factor=BigInt(coinDisplayUnits[currency]);
    let numerator,denominator;
    if(record.integerUnits!==undefined&&record.scale!==undefined){
      numerator=BigInt(record.integerUnits)*factor;
      denominator=BigInt(record.scale);
    }
    else{
      const match=/^([+-]?)(\d+)(?:\.(\d+))?$/.exec(String(record.amount));
      if(!match)throw new Error('账户金额格式无效。');
      const fraction=match[3]||'';
      numerator=BigInt(match[2]+fraction)*factor*(match[1]==='-'?-1n:1n);
      denominator=10n**BigInt(fraction.length);
    }
    if(denominator<=0n||numerator%denominator!==0n)throw new Error('账户金额无法按完整铜币准确显示。');
    const signed=numerator/denominator,negative=signed<0n,total=negative?-signed:signed;
    const goldUnit=BigInt(coinDisplayUnits.gold),silverUnit=BigInt(coinDisplayUnits.silver);
    return {
      negative,parts:[{
        amount:(total/goldUnit).toString(),unit:'金币'
      },{
        amount:(total%goldUnit/silverUnit).toString(),unit:'银币'
      },{
        amount:(total%goldUnit%silverUnit).toString(),unit:'铜币'
      }]
    };
  }
  function moneyText(record){
    const coins=moneyCoinParts(record);
    if(!coins)return money(record.amount)+record.unit;
    const text=coins.parts.map(p=>money(p.amount)+p.unit).join('');
    return coins.negative?'−（'+text+'）':text;
  }
  function moneyHtml(record){
    const coins=moneyCoinParts(record);
    if(!coins)return `<span class="vs-denomination-group"><span class="vs-coin-piece" data-coin="${esc(record.unit)}"><span class="vs-coin-number">${esc(money(record.amount)).replace(/,/g,',<wbr>')}</span><span class="vs-account-unit">${esc(record.unit)}</span></span></span>`;
    const parts=coins.parts.map(p=>`<span class="vs-coin-piece" data-coin="${p.unit}"><span class="vs-coin-number">${money(p.amount).replace(/,/g,',<wbr>')}</span><span class="vs-account-unit">${p.unit}</span></span>`).join('');
    return `<span class="vs-denomination-group">${coins.negative?'<span>−（</span>':''}${parts}${coins.negative?'<span>）</span>':''}</span>`;
  }
  q('version').textContent=meta.version+' · 存档快照 '+meta.gameTime.replace('T',' ')+' · 第 '+meta.voyageDay+' 天';
  q('time').textContent='游戏时间 '+meta.gameTime.replace('T',' ').slice(0,16);
  render();
})();
</script>
</div>

</main>
</body>
</html>

<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101717"><title>登录远航 · VOYAGER</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/login.js" defer></script>
</head><body class="login-body">
<main class="login-card">
<a class="brand" href="/" aria-label="远航"><img src="/icon.svg" alt=""><span>远航<small>VOYAGER</small></span></a>
<div class="eyebrow">YOUR VOYAGE AWAITS</div><h1>欢迎回来，指挥官。</h1>
<p class="login-intro">登录你的指挥台，继续群星之间的故事。</p>
<form id="login-form" method="post" action="/api/auth/login">
<label for="username">用户名</label><input id="username" name="username" type="text" autocomplete="username" required maxlength="64" autocapitalize="none" spellcheck="false">
<label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
<p id="login-error" class="error" role="alert"></p><button class="primary" id="login-submit" type="submit">登录指挥台 ↗</button>
</form>
<p class="login-note">使用游戏账号登录。模型 API 在登录后的设置页配置。</p>
<noscript><p class="error">请启用浏览器 JavaScript 后登录。</p></noscript>
</main></body></html>
